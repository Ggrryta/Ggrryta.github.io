name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 要求 Node >= 22.23.4；写 "22" 可能解析到 22.23.3 而直接启动失败，
          # 因此固定到 24 LTS
          node-version: 24
      - name: Install dependencies
        run: npm ci

      # 环境自检：结果以 notice 形式输出，可从 check-runs annotations 读取
      - name: 环境自检
        run: |
          {
            echo "node=$(node -v)"
            echo "npm=$(npm -v)"
            echo "astro_bin=$(ls node_modules/.bin/ 2>/dev/null | grep -c '^astro$')"
            echo "astrojs_check=$([ -d node_modules/@astrojs/check ] && echo yes || echo no)"
            echo "pagefind=$([ -d node_modules/pagefind ] && echo yes || echo no)"
            echo "typescript=$([ -d node_modules/typescript ] && echo yes || echo no)"
            echo "sharp_installed=$([ -d node_modules/sharp ] && echo yes || echo no)"
            node -e "try{require('sharp');console.log('sharp_load=OK')}catch(e){console.log('sharp_load=FAIL: '+String(e.message).split('\n')[0])}"
            echo "disk=$(df -h . | tail -1 | awk '{print $4}')"
          } | sed 's/^/::notice::/'

      # 失败时把日志尾部压成单行作为 error annotation 输出，便于直接看到真实原因
      - name: Build
        run: |
          set -o pipefail
          if npm run build > build.log 2>&1; then
            tail -5 build.log
          else
            echo "::error::$(grep -inE 'error|cannot|not found|failed|ELIFECYCLE' build.log | tail -20 | tr '\n' '|')"
            echo "::error::log-head: $(head -40 build.log | tr '\n' '|')"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
