name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci

      # 环境自检：结果以 notice 形式输出，可从 check-runs annotations 读取
      - name: 环境自检
        run: |
          {
            echo "node=$(node -v)"
            echo "npm=$(npm -v)"
            echo "astro_bin=$(ls node_modules/.bin/ 2>/dev/null | grep -c '^astro$')"
            echo "sharp_installed=$([ -d node_modules/sharp ] && echo yes || echo no)"
            node -e "try{require('sharp');console.log('sharp_load=OK')}catch(e){console.log('sharp_load=FAIL: '+String(e.message).split('\n')[0])}"
            node -e "try{require('satori');console.log('satori_load=OK')}catch(e){console.log('satori_load=FAIL: '+String(e.message).split('\n')[0])}"
            echo "disk=$(df -h . | tail -1 | awk '{print $4}')"
          } | sed 's/^/::notice::/'

      # 失败时把日志尾部作为 error annotation 输出，便于直接看到真实原因
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo "::error::$(tail -60 build.log)"
            exit 1
          }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
